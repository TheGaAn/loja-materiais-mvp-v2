<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Materiais Sao Jose{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --toque: 44px; }
    body { font-size: 17px; }
    .btn, .form-control, .form-select { min-height: var(--toque); }
    .btn-principal { background:#1f4e79; color:#fff; font-weight:600; }
    .btn-principal:hover { background:#173a5a; color:#fff; }
    .alerta-minimo { border-left: 8px solid #b05a00; background: #fdf3e6; }
    .tabela th { background:#eef1f4; }
    .rotulo { font-weight:600; color:#333; }
    .foco:focus-visible { outline: 3px solid #1f4e79; outline-offset: 2px; }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark" style="background:#1f4e79">
  <div class="container-fluid">
    <span class="navbar-brand">Materiais Sao Jose</span>
    {% if nome %}
    <div class="d-flex align-items-center gap-3 text-white">
      <span>{{ nome }} &middot; {{ perfil }}</span>
      <form method="post" action="/logout" class="m-0">
        <button class="btn btn-sm btn-outline-light" type="submit">Sair</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% block conteudo %}{% endblock %}
</main>
</body>
</html>
