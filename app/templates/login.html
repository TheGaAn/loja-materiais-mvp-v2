{% extends "base.html" %}
{% block titulo %}Entrar - Materiais Sao Jose{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-12 col-md-5">
    <h1 class="h4 mb-4">Entrar no sistema</h1>
    {% if erro %}<div class="alert alert-danger" role="alert">{{ erro }}</div>{% endif %}
    <form method="post" action="/login" class="card card-body shadow-sm">
      <label class="rotulo" for="usuario">Usuario</label>
      <input class="form-control mb-3 foco" id="usuario" name="usuario" autocomplete="username" required>
      <label class="rotulo" for="senha">Senha</label>
      <input class="form-control mb-4 foco" id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button class="btn btn-principal" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
